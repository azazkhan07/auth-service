spring:
  application:
    name: auth-service
  config:
    import: "configserver:http://localhost:8089/"
management:
  endpoints:
    web:
      exposure:
        include: "*"
  info:
    env:
      enabled: true

info:
  app:
    name: "Auth Service"
    description: "Authentication and Authorization Service"
    version: "1.0"

eureka:
  instance:
    prefer-ip-address: true
    hostname: localhost

jwt:
  access:
    expiration: 86400000

  refresh:
    expiration: 604800000
  secret: ${JWT_SECRET}